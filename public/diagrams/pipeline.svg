<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="The doc2mcp pipeline: Documentation to Crawling to Knowledge Processing to Retrieval to MCP Generation to AI Agents">
  <title>The doc2mcp pipeline</title>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .frame { fill: none; stroke: #e4e4e7; stroke-width: 2; }
      .title { font-family: system-ui, sans-serif; font-size: 24px; font-weight: 600; fill: #18181b; }
      .tagline { font-family: system-ui, sans-serif; font-size: 16px; fill: #71717a; }
      .label { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 600; fill: #18181b; }
      .sub { font-family: system-ui, sans-serif; font-size: 14px; fill: #71717a; }
      .arrow { fill: none; stroke: #71717a; stroke-width: 2.5; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="300" rx="12"/>
  <rect class="frame" x="8" y="8" width="1264" height="284" rx="8"/>

  <text class="title" x="36" y="42">The doc2mcp pipeline</text>
  <text class="tagline" x="36" y="68">Documentation → AI agents</text>

  <g transform="translate(24, 92)">
    <path d="M4 6 C6 2 12 4 18 3 L158 5 C164 3 170 6 168 12 L166 118 C168 124 162 128 156 126 L12 128 C6 130 2 122 4 116 Z" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 24 L22 68 C22 72 26 74 30 72 L52 68 C56 66 58 62 56 58 L56 20 C56 16 52 14 48 16 L26 22 C24 23 22 24 22 24 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/>
    <text class="label" x="72" y="44">Documentation</text>
    <text class="sub" x="72" y="66">Any docs URL</text>
  </g>

  <path class="arrow" d="M196 156 C204 150 210 156 218 156 L228 156"/>
  <path class="arrow" d="M224 150 L234 156 L224 162"/>

  <g transform="translate(216, 92)">
    <path d="M4 6 C6 2 12 4 18 3 L158 5 C164 3 170 6 168 12 L166 118 C168 124 162 128 156 126 L12 128 C6 130 2 122 4 116 Z" fill="#ecfdf5" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="42" cy="48" rx="22" ry="22" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text class="label" x="72" y="44">Crawling</text>
    <text class="sub" x="72" y="66">Fetch + preserve</text>
  </g>

  <path class="arrow" d="M388 156 L408 156"/>
  <path class="arrow" d="M404 150 L414 156 L404 162"/>

  <g transform="translate(408, 92)">
    <path d="M4 6 C6 2 12 4 18 3 L158 5 C164 3 170 6 168 12 L166 118 C168 124 162 128 156 126 L12 128 C6 130 2 122 4 116 Z" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="72" y="40">Knowledge</text>
    <text class="label" x="72" y="60">Processing</text>
    <text class="sub" x="72" y="82">Chunk + index</text>
  </g>

  <path class="arrow" d="M580 156 L600 156"/>
  <path class="arrow" d="M596 150 L606 156 L596 162"/>

  <g transform="translate(600, 92)">
    <path d="M4 6 C6 2 12 4 18 3 L158 5 C164 3 170 6 168 12 L166 118 C168 124 162 128 156 126 L12 128 C6 130 2 122 4 116 Z" fill="#fff7ed" stroke="#fb923c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="40" cy="48" r="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/>
    <path d="M50 58 L62 72" stroke="#ea580c" stroke-width="3.2" stroke-linecap="round"/>
    <text class="label" x="72" y="44">Retrieval</text>
    <text class="sub" x="72" y="66">Ranked sections</text>
  </g>

  <path class="arrow" d="M772 156 L792 156"/>
  <path class="arrow" d="M788 150 L798 156 L788 162"/>

  <g transform="translate(792, 92)">
    <path d="M4 6 C6 2 12 4 18 3 L158 5 C164 3 170 6 168 12 L166 118 C168 124 162 128 156 126 L12 128 C6 130 2 122 4 116 Z" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="22" y="28" width="38" height="44" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text class="label" x="72" y="40">MCP</text>
    <text class="label" x="72" y="60">Generation</text>
    <text class="sub" x="72" y="82">Hosted endpoint</text>
  </g>

  <path class="arrow" d="M964 156 L984 156"/>
  <path class="arrow" d="M980 150 L990 156 L980 162"/>

  <g transform="translate(984, 92)">
    <path d="M4 6 C6 2 12 4 18 3 L158 5 C164 3 170 6 168 12 L166 118 C168 124 162 128 156 126 L12 128 C6 130 2 122 4 116 Z" fill="#fff1f2" stroke="#fb7185" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="24" y="30" width="36" height="40" rx="7" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
    <text class="label" x="72" y="44">AI Agents</text>
    <text class="sub" x="72" y="66">Cursor · Claude</text>
  </g>

  <path d="M36 248 C400 242 880 252 1244 244" fill="none" stroke="#d4d4d8" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <text class="tagline" x="36" y="278">doc2mcp end-to-end flow</text>
</svg>

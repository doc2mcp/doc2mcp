name: Deploy Staging

# Staging deploys run on every push to the `staging` branch and publish a
# Vercel preview deployment aliased to the staging environment. Production is
# still tag-gated (see deploy-production.yml).
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Vercel staging (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Skip when commit requests it
        id: skip
        run: |
          MSG="$(git log -1 --pretty=%B)"
          if echo "$MSG" | grep -qi '\[skip vercel\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping staging deploy ([skip vercel] in commit message)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.skip.outputs.skip != 'true'
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        if: steps.skip.outputs.skip != 'true'
        with:
          version: 10.32.1

      - name: Install Vercel CLI
        if: steps.skip.outputs.skip != 'true'
        run: npm i -g vercel@latest

      - name: Pull Vercel project settings (preview)
        if: steps.skip.outputs.skip != 'true'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (preview)
        if: steps.skip.outputs.skip != 'true'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to staging
        if: steps.skip.outputs.skip != 'true'
        run: vercel deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}

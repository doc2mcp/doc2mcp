name: PR AI code review

# Gemini review for PRs into staging only (feature → staging). Skips staging → main
# release PRs. Requires GEMINI_API_KEY in repo secrets.
#
# Merge blocking: when the model reports any high-confidence must_fix (or the
# local secret scan hits), scripts/pr-ai-review.mjs exits 1 so this check fails.
# Mark "Gemini PR review" as a required status check on staging for hard blocks.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [staging]

concurrency:
  group: pr-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: Gemini PR review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'staging'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run AI review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Full model (not lite): fewer false positives after full-file analysis
          GEMINI_MODEL: gemini-2.5-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REVIEW_MAX_DIFF_CHARS: "180000"
          REVIEW_DEEP: "1"
          REVIEW_MAX_INLINE: "15"
        run: node scripts/pr-ai-review.mjs
